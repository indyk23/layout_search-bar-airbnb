<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search bars</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <form class="search search--big" data-qa="big">
        <img src="images/Search.svg" alt="lupa"/>
        <input
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
          aria-label="Big search"
        />
      </form>

      <form class="search search--small" data-qa="small">
        <img src="images/Search.svg" alt="lupa"/>
        <input
          type="text"
          placeholder="Try “Los Angeles"
          aria-label="Small search"
        />
      </form>
    </main>
  </body>
</html>
